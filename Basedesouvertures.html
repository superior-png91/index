<style>
/* Mise en page : le coffret d'échecs du club. Navigation le long de la grande diagonale du fou (a1 → h8) à gauche,
   leçon au centre, échiquier en bois collant à droite (empilés sur téléphone). Un seul thème, sombre, assumé. */
:root {
  --ebene: #120d0a;
  --noyer: #1d140f;
  --noyer-2: #261a13;
  --acajou: #33190f;
  --palissandre: #6e4630;
  --erable: #ead7b1;
  --or: #d3a24a;
  --or-pale: #ecc97f;
  --ivoire: #f5ebd8;
  --sepia: #c2aa88;
  --line: #43301f;
  --ok: #8fd19e;
  --ok-bg: #1c2a1c;
  --err: #f09a86;
  --err-bg: #3a1c15;
  --sq-l1: #e8d5af; --sq-l2: #e3cfa6;
  --sq-d1: #8e5c3b; --sq-d2: #875737;
  --display: "Bodoni Moda", "Bodoni 72", Didot, Georgia, serif;
  --body: "Karla", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
  --vh: 100vh;
}
@supports (height: 100dvh) { :root { --vh: 100dvh; } }
* { box-sizing: border-box; }
html { background: var(--noyer); }
body { background: var(--noyer); color: var(--ivoire); font-family: var(--body); font-size: 16px; line-height: 1.6; }
h1, h2, h3 { font-family: var(--display); font-weight: 500; line-height: 1.08; text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; }
button, a, select, input, label { touch-action: manipulation; }
a { color: var(--or-pale); }
:focus-visible { outline: 2px solid var(--or); outline-offset: 3px; }

.app { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 100vh; }
.nav { background: var(--ebene); border-right: 1px solid var(--line); padding-block: 22px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ivoire); margin-bottom: 20px; }
.brand svg { width: 22px; height: 31px; color: var(--or); flex: none; }
.brand b { display: block; font-family: var(--display); font-style: italic; font-weight: 500; font-size: 21px; line-height: 1.1; }
.brand small { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--sepia); }
.nav-group { margin-top: 14px; }
.nav-label { display: flex; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--or); padding: 0 8px 6px; }
.nav a.lk { display: flex; gap: 10px; align-items: baseline; padding: 6px 8px; border-radius: 6px; text-decoration: none; color: var(--erable); font-size: 14.5px; line-height: 1.3; }
.nav a.lk:hover { background: var(--noyer-2); color: var(--ivoire); }
.nav a.lk.active { background: var(--acajou); color: var(--or-pale); box-shadow: inset 2px 0 0 var(--or); }
.nav .num { font-family: var(--mono); font-size: 12px; color: var(--sepia); min-width: 1.9em; }
.nav .tick { margin-left: auto; color: var(--ok); font-size: 13px; }
.sqtag { display: inline-grid; place-items: center; width: 26px; height: 26px; border: 1px solid var(--or); font-family: var(--mono); font-size: 11px; color: var(--or); flex: none; align-self: center; }
.nav a.lk .sqtag { width: 22px; height: 22px; font-size: 10px; }
.nav a.lk.active .sqtag { background: var(--palissandre); color: var(--erable); }
.retour { display: inline-block; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--or); text-decoration: none; margin: 0 0 16px 8px; }
.retour:hover { color: var(--or-pale); }
.nav-top { display: none; }
.nav-top .brand .short { display: none; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) clamp(360px, 38vw, 1000px); gap: 36px; padding-block: 34px 56px; padding-left: 36px; padding-right: max(24px, env(safe-area-inset-right, 0px)); align-items: start; }
.content { min-width: 0; max-width: 740px; display: flex; flex-direction: column; gap: 34px; }

.eyebrow { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--or); }
.eyebrow .sqtag { width: 32px; height: 32px; font-size: 12px; letter-spacing: 0; text-transform: none; }
.eyebrow .sqtag.dk { background: var(--palissandre); color: var(--erable); }
.page-head { display: flex; flex-direction: column; gap: 14px; }
.page-head h1 { font-size: clamp(32px, 4.6vw, 50px); letter-spacing: -.01em; }
.page-head h1 em { color: var(--or-pale); }
.lead { color: var(--sepia); max-width: 60ch; font-size: 17px; }
section > h2 { font-size: 26px; margin-bottom: 14px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
section > h2 small { font-family: var(--mono); font-size: 12px; color: var(--sepia); letter-spacing: .06em; }
.prose p { max-width: 64ch; margin-bottom: 8px; }
.points { margin: 8px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.points li::marker { color: var(--or); }

.box { border: 1px solid color-mix(in srgb, var(--or) 35%, transparent); background: var(--ebene); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.box h3 { font-size: 20px; }
.box .k { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--or); }
.conds { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 15px; color: var(--erable); }
.conds li { display: flex; gap: 10px; }
.conds li::before { content: "✓"; color: var(--or); }
.box .small { font-size: 14px; color: var(--sepia); }

.items { display: flex; flex-direction: column; gap: 10px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 14px 16px; background: var(--noyer-2); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; text-align: left; width: 100%; transition: border-color .2s, background .2s; }
.item:hover { border-color: var(--or); }
.item.loaded { border-color: var(--or); background: var(--acajou); }
.item-title { font-weight: 700; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.stars { color: var(--or); font-size: 13px; letter-spacing: .08em; }
.item-sub { grid-column: 1 / -1; color: var(--sepia); font-size: 14.5px; }
.moves-inline { font-family: var(--mono); font-size: 13px; grid-column: 1 / -1; overflow-wrap: anywhere; color: var(--erable); }
.chip { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--sepia); white-space: nowrap; }
.chip.ok { border-color: var(--ok); color: var(--ok); }
.chip.seen { border-color: var(--sepia); color: var(--erable); }
.chip.trap { border-color: #e0874f; color: #f2b8a0; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 11px; cursor: pointer; font-size: 13px; color: var(--erable); }
.filters button.on { background: var(--or); border-color: var(--or); color: var(--ebene); font-weight: 700; }

.game-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 18px; padding: 18px; border-radius: 10px; background: linear-gradient(140deg, var(--acajou), var(--ebene)); border: 1px solid color-mix(in srgb, var(--or) 40%, transparent); cursor: pointer; text-align: left; width: 100%; }
.game-card:hover, .game-card.loaded { border-color: var(--or); }
.game-card .yr { grid-row: span 3; font-family: var(--display); font-style: italic; font-size: 44px; line-height: 1; color: var(--or-pale); }
.game-card h3 { font-size: 23px; }
.game-card .pl { font-family: var(--mono); font-size: 12px; color: var(--sepia); }
.game-card p { grid-column: 2; color: var(--erable); font-size: 14.5px; }
.game-card .why { grid-column: 1 / -1; font-size: 14px; color: var(--sepia); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }

.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }
.pager a { text-decoration: none; font-weight: 700; }

/* Accueil */
.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.level { background: var(--noyer-2); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.level h3 { font-size: 24px; }
.level .elo { font-size: 13.5px; color: var(--sepia); }
.level ol { margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; font-size: 14px; }
.level ol a { text-decoration: none; color: var(--erable); display: flex; gap: 8px; padding: 3px 0; }
.level ol a:hover { color: var(--or-pale); }
.level ol .num { font-family: var(--mono); color: var(--sepia); min-width: 1.8em; font-size: 12.5px; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--or), var(--or-pale)); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--ebene); text-decoration: none; color: var(--ivoire); }
.tile:hover { border-color: var(--or); }
.tile b { font-family: var(--display); font-weight: 500; font-size: 21px; }
.tile span { color: var(--sepia); font-size: 14px; }
.source { font-size: 13.5px; color: var(--sepia); }

/* Répertoire */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--noyer-2); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--or); background: var(--ebene); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--acajou); }
tbody tr.loaded td { background: var(--acajou); box-shadow: inset 0 -1px 0 var(--or); }
td.mono { font-family: var(--mono); font-size: 12.5px; min-width: 220px; }
td.c { text-align: center; font-family: var(--mono); }
.note { font-size: 14.5px; color: var(--sepia); margin: 10px 0 0; }
.note b { color: var(--erable); }

/* Carnet */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stat { padding: 18px 14px 18px 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--line); padding-left: 14px; }
.stat b { font-family: var(--display); font-weight: 500; font-size: 40px; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
.stat span { font-size: 13.5px; color: var(--sepia); }
.rows { display: flex; flex-direction: column; gap: 10px; }
.row { display: grid; grid-template-columns: 150px minmax(0, 1fr) 64px; gap: 12px; align-items: center; font-size: 14.5px; }
.row .bar { height: 8px; }
.row span:last-child { font-family: var(--mono); font-size: 12.5px; color: var(--sepia); text-align: right; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--err); }

/* QCM */
.q { padding: 12px 14px; background: var(--noyer-2); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.q .moves-inline { flex: 1 1 100%; cursor: pointer; }
.q button { border: 1px solid var(--line); background: var(--ebene); border-radius: 999px; padding: 4px 13px; cursor: pointer; font-size: 14px; }
.q button.right { border-color: var(--ok); color: var(--ok); font-weight: 700; }
.q button.wrong { border-color: var(--err); color: var(--err); }

/* Panneau échiquier */
.panel { --reserve: 285px; position: sticky; top: 22px; max-height: calc(var(--vh) - 44px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-gutter: stable both-edges; background: var(--ebene); border: 1px solid color-mix(in srgb, var(--or) 30%, transparent); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel > * { flex-shrink: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.panel-title { font-family: var(--display); font-size: 22px; line-height: 1.15; }
.panel-kind { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--or); white-space: nowrap; }
.consigne { font-size: 15px; color: var(--erable); }
.panel.has-consigne { --reserve: 345px; }
.board-wrap { position: relative; width: min(100%, max(300px, calc(var(--vh) - var(--reserve)))); container-type: inline-size; margin-inline: auto; aspect-ratio: 1; touch-action: none; user-select: none; -webkit-user-select: none; border: 11px solid #3e2415; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .35), 0 0 0 3px #d0a254, 0 0 0 7px #281a0b, 0 30px 50px -24px rgba(0, 0, 0, .7); }
.board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; height: 100%; background: repeating-conic-gradient(var(--sq-d1) 0 25%, var(--sq-l1) 0 50%) 0 0 / 25% 25%; }
.sq { position: relative; background: linear-gradient(135deg, var(--sq-l1), var(--sq-l2)); }
.sq.d { background: linear-gradient(135deg, var(--sq-d1), var(--sq-d2)); }
.sq.last::before, .sq.sel::before, .sq.check::before, .sq.hint::before { content: ""; position: absolute; inset: 0; }
.sq.last::before { background: rgba(211, 162, 74, .45); }
.sq.sel::before { background: rgba(236, 201, 127, .72); }
.sq.hint::before { box-shadow: inset 0 0 0 4px #e0874f; background: rgba(224, 135, 79, .22); }
.sq.check::before { background: radial-gradient(circle, rgba(220, 50, 40, .85), rgba(220, 50, 40, .2) 65%, transparent 78%); }
.sq .pc { position: absolute; inset: 2%; background-size: 100% 100%; z-index: 1; cursor: grab; filter: drop-shadow(0 3px 2.5px rgba(0, 0, 0, .42)); }
.sq.target::after { content: ""; position: absolute; left: 50%; top: 50%; width: 30%; height: 30%; transform: translate(-50%, -50%); border-radius: 50%; background: rgba(40, 22, 10, .38); z-index: 2; pointer-events: none; }
.sq.target.cap::after { width: 90%; height: 90%; background: transparent; border: 5px solid rgba(40, 22, 10, .38); }
.coord { position: absolute; font-family: var(--mono); font-size: 10px; font-size: clamp(8px, 2.2cqw, 16px); line-height: 1; z-index: 3; pointer-events: none; }
.coord.f { right: 3px; bottom: 2px; }
.coord.r { left: 3px; top: 3px; }
.sq .coord { color: var(--sq-d1); }
.sq.d .coord { color: var(--sq-l1); }
.ghost { position: fixed; pointer-events: none; z-index: 50; background-size: 100% 100%; transform: translate(-50%, -50%); filter: drop-shadow(0 6px 6px rgba(0, 0, 0, .5)); }
.promo { position: absolute; inset: 0; background: rgba(10, 7, 5, .62); display: grid; place-items: center; z-index: 10; }
.promo-box { background: var(--noyer-2); border: 1px solid var(--or); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.promo-box div { display: flex; gap: 6px; }
.promo-box button[data-p]:not([data-p="x"]) { width: 54px; height: 54px; border: 1px solid var(--line); border-radius: 8px; background-color: var(--sq-l1); background-size: 88%; background-position: center; background-repeat: no-repeat; cursor: pointer; }
.status { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-family: var(--mono); font-size: 12px; color: var(--sepia); }
.turn { display: inline-flex; align-items: center; gap: 6px; }
.turn i { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--sepia); display: inline-block; }
.turn i.w { background: var(--ivoire); }
.turn i.b { background: #000; }
.mat b { color: var(--or-pale); font-weight: 500; }
.feedback { font-size: 15px; padding: 11px 13px; border-radius: 8px; background: var(--noyer-2); border-left: 3px solid var(--or); min-height: 2.8em; }
.feedback.ok { background: var(--ok-bg); border-left-color: var(--ok); }
.feedback.ok b { color: var(--ok); }
.feedback.err { background: var(--err-bg); border-left-color: var(--err); }
.feedback.err b { color: var(--err); }
.feedback .sol { display: block; color: var(--erable); margin-top: 6px; }
.comment { font-size: 15px; font-style: italic; color: var(--or-pale); border-left: 3px solid var(--or); padding: 2px 0 2px 12px; }
.controls { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--noyer-2); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 14px; font-weight: 700; color: var(--erable); transition: border-color .2s, color .2s, background .2s; }
.btn:hover:not(:disabled) { border-color: var(--or); color: var(--or-pale); }
.btn:disabled { opacity: .35; cursor: default; }
.btn.primary { background: var(--or); border-color: var(--or); color: var(--ebene); }
.btn.primary:hover:not(:disabled) { background: var(--or-pale); color: var(--ebene); }
.btn.icon { min-width: 42px; font-family: var(--mono); }
.btn.ic { display: inline-flex; align-items: center; gap: 7px; }
.btn.ic svg { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn.danger { border-color: var(--err); color: var(--err); }
.typein { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--sepia); }
.typein input { flex: 1 1 140px; min-width: 0; font: inherit; font-family: var(--mono); font-size: 14px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--noyer-2); color: var(--ivoire); }
.typein input:focus { border-color: var(--or); outline: none; }
.movelist { display: flex; flex-wrap: wrap; gap: 2px 3px; font-family: var(--mono); font-size: 13px; max-height: 128px; overflow-y: auto; }
.movelist .n { color: var(--sepia); padding: 2px 0 2px 5px; }
.movelist button { border: 0; background: none; padding: 2px 5px; border-radius: 3px; cursor: pointer; color: var(--erable); }
.movelist button:hover { background: var(--noyer-2); }
.movelist button.cur { background: var(--or); color: var(--ebene); }
.movelist button.free { font-style: italic; color: var(--sepia); }
.fen { font-family: var(--mono); font-size: 10.5px; color: #8c7759; overflow-wrap: anywhere; }

/* Mode séance : l'échiquier en grand, pour le mur ou le vidéoprojecteur */
.panel:fullscreen { position: static; display: grid; grid-template-columns: min(92vh, 62vw) minmax(280px, 1fr); grid-template-rows: auto auto 1fr; align-content: center; gap: 14px 32px; padding: 3vh 3vw; border: 0; border-radius: 0; background: radial-gradient(ellipse at 40% 40%, #2a1a10, var(--ebene) 75%); }
.panel:fullscreen { max-height: none; overflow: auto; }
.panel:fullscreen .board-wrap { grid-column: 1; grid-row: 1 / span 6; align-self: center; width: 100%; }
.panel:fullscreen > :not(.board-wrap) { grid-column: 2; }
.panel:fullscreen .panel-title { font-size: 34px; }
.panel:fullscreen .feedback, .panel:fullscreen .consigne, .panel:fullscreen .comment { font-size: 19px; }
.panel:fullscreen .movelist { font-size: 16px; max-height: none; }

    /* 4th criterion: 4th field is a valid e.p.-string? */
    if (!/^(-|[abcdefgh][36])$/.test(tokens[3])) {
      return { valid: false, error_number: 4, error: errors[4] }
    }

    /* 5th criterion: 3th field is a valid castle-string? */
    if (!/^(KQ?k?q?|Qk?q?|kq?|q|-)$/.test(tokens[2])) {
      return { valid: false, error_number: 5, error: errors[5] }
    }

    /* 6th criterion: 2nd field is "w" (white) or "b" (black)? */
    if (!/^(w|b)$/.test(tokens[1])) {
      return { valid: false, error_number: 6, error: errors[6] }
    }

    /* 7th criterion: 1st field contains 8 rows? */
    var rows = tokens[0].split('/')
    if (rows.length !== 8) {
      return { valid: false, error_number: 7, error: errors[7] }
    }

    /* 8th criterion: every row is valid? */
    for (var i = 0; i < rows.length; i++) {
      /* check for right sum of fields AND not two numbers in succession */
      var sum_fields = 0
      var previous_was_number = false

      for (var k = 0; k < rows[i].length; k++) {
        if (!isNaN(rows[i][k])) {
          if (previous_was_number) {
            return { valid: false, error_number: 8, error: errors[8] }
          }
          sum_fields += parseInt(rows[i][k], 10)
          previous_was_number = true
        } else {
          if (!/^[prnbqkPRNBQK]$/.test(rows[i][k])) {
            return { valid: false, error_number: 9, error: errors[9] }
          }
          sum_fields += 1
          previous_was_number = false
        }
      }
      if (sum_fields !== 8) {
        return { valid: false, error_number: 10, error: errors[10] }
      }
    }

    if (
      (tokens[3][1] == '3' && tokens[1] == 'w') ||
      (tokens[3][1] == '6' && tokens[1] == 'b')
    ) {
      return { valid: false, error_number: 11, error: errors[11] }
    }

    /* everything's okay! */
    return { valid: true, error_number: 0, error: errors[0] }
  }

  function generate_fen() {
    var empty = 0
    var fen = ''

    for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
      if (board[i] == null) {
        empty++
      } else {
        if (empty > 0) {
          fen += empty
          empty = 0
        }
        var color = board[i].color
        var piece = board[i].type

        fen += color === WHITE ? piece.toUpperCase() : piece.toLowerCase()
      }

      if ((i + 1) & 0x88) {
        if (empty > 0) {
          fen += empty
        }

        if (i !== SQUARES.h1) {
          fen += '/'
        }

        empty = 0
        i += 8
      }
    }

    var cflags = ''
    if (castling[WHITE] & BITS.KSIDE_CASTLE) {
      cflags += 'K'
    }
    if (castling[WHITE] & BITS.QSIDE_CASTLE) {
      cflags += 'Q'
    }
    if (castling[BLACK] & BITS.KSIDE_CASTLE) {
      cflags += 'k'
    }
    if (castling[BLACK] & BITS.QSIDE_CASTLE) {
      cflags += 'q'
    }

    /* do we have an empty castling flag? */
    cflags = cflags || '-'
    var epflags = ep_square === EMPTY ? '-' : algebraic(ep_square)

    return [fen, turn, cflags, epflags, half_moves, move_number].join(' ')
  }

  function set_header(args) {
    for (var i = 0; i < args.length; i += 2) {
      if (typeof args[i] === 'string' && typeof args[i + 1] === 'string') {
        header[args[i]] = args[i + 1]
      }
    }
    return header
  }

  /* called when the initial board setup is changed with put() or remove().
   * modifies the SetUp and FEN properties of the header object.  if the FEN is
   * equal to the default position, the SetUp and FEN are deleted
   * the setup is only updated if history.length is zero, ie moves haven't been
   * made.
   */
  function update_setup(fen) {
    if (history.length > 0) return

    if (fen !== DEFAULT_POSITION) {
      header['SetUp'] = '1'
      header['FEN'] = fen
    } else {
      delete header['SetUp']
      delete header['FEN']
    }
  }

  function get(square) {
    var piece = board[SQUARES[square]]
    return piece ? { type: piece.type, color: piece.color } : null
  }

  function put(piece, square) {
    /* check for valid piece object */
    if (!('type' in piece && 'color' in piece)) {
      return false
    }

    /* check for piece */
    if (SYMBOLS.indexOf(piece.type.toLowerCase()) === -1) {
      return false
    }

    /* check for valid square */
    if (!(square in SQUARES)) {
      return false
    }

    var sq = SQUARES[square]

    /* don't let the user place more than one king */
    if (
      piece.type == KING &&
      !(kings[piece.color] == EMPTY || kings[piece.color] == sq)
    ) {
      return false
    }

    board[sq] = { type: piece.type, color: piece.color }
    if (piece.type === KING) {
      kings[piece.color] = sq
    }

    update_setup(generate_fen())

    return true
  }

  function remove(square) {
    var piece = get(square)
    board[SQUARES[square]] = null
    if (piece && piece.type === KING) {
      kings[piece.color] = EMPTY
    }

    update_setup(generate_fen())

    return piece
  }

  function build_move(board, from, to, flags, promotion) {
    var move = {
      color: turn,
      from: from,
      to: to,
      flags: flags,
      piece: board[from].type
    }

    if (promotion) {
      move.flags |= BITS.PROMOTION
      move.promotion = promotion
    }

    if (board[to]) {
      move.captured = board[to].type
    } else if (flags & BITS.EP_CAPTURE) {
      move.captured = PAWN
    }
    return move
  }

  function generate_moves(options) {
    function add_move(board, moves, from, to, flags) {
      /* if pawn promotion */
      if (
        board[from].type === PAWN &&
        (rank(to) === RANK_8 || rank(to) === RANK_1)
      ) {
        var pieces = [QUEEN, ROOK, BISHOP, KNIGHT]
        for (var i = 0, len = pieces.length; i < len; i++) {
          moves.push(build_move(board, from, to, flags, pieces[i]))
        }
      } else {
        moves.push(build_move(board, from, to, flags))
      }
    }

    var moves = []
    var us = turn
    var them = swap_color(us)
    var second_rank = { b: RANK_7, w: RANK_2 }

    var first_sq = SQUARES.a8
    var last_sq = SQUARES.h1
    var single_square = false

    /* do we want legal moves? */
    var legal =
      typeof options !== 'undefined' && 'legal' in options
        ? options.legal
        : true

    /* are we generating moves for a single square? */
    if (typeof options !== 'undefined' && 'square' in options) {
      if (options.square in SQUARES) {
        first_sq = last_sq = SQUARES[options.square]
        single_square = true
      } else {
        /* invalid square */
        return []
      }
    }

    for (var i = first_sq; i <= last_sq; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece == null || piece.color !== us) {
        continue
      }

      if (piece.type === PAWN) {
        /* single square, non-capturing */
        var square = i + PAWN_OFFSETS[us][0]
        if (board[square] == null) {
          add_move(board, moves, i, square, BITS.NORMAL)

          /* double square */
          var square = i + PAWN_OFFSETS[us][1]
          if (second_rank[us] === rank(i) && board[square] == null) {
            add_move(board, moves, i, square, BITS.BIG_PAWN)
          }
        }

        /* pawn captures */
        for (j = 2; j < 4; j++) {
          var square = i + PAWN_OFFSETS[us][j]
          if (square & 0x88) continue

          if (board[square] != null && board[square].color === them) {
            add_move(board, moves, i, square, BITS.CAPTURE)
          } else if (square === ep_square) {
            add_move(board, moves, i, ep_square, BITS.EP_CAPTURE)
          }
        }
      } else {
        for (var j = 0, len = PIECE_OFFSETS[piece.type].length; j < len; j++) {
          var offset = PIECE_OFFSETS[piece.type][j]
          var square = i

          while (true) {
            square += offset
            if (square & 0x88) break

            if (board[square] == null) {
              add_move(board, moves, i, square, BITS.NORMAL)
            } else {
              if (board[square].color === us) break
              add_move(board, moves, i, square, BITS.CAPTURE)
              break
            }

            /* break, if knight or king */
            if (piece.type === 'n' || piece.type === 'k') break
          }
        }
      }
    }

    /* check for castling if: a) we're generating all moves, or b) we're doing
     * single square move generation on the king's square
     */
    if (!single_square || last_sq === kings[us]) {
      /* king-side castling */
      if (castling[us] & BITS.KSIDE_CASTLE) {
        var castling_from = kings[us]
        var castling_to = castling_from + 2

        if (
          board[castling_from + 1] == null &&
          board[castling_to] == null &&
          !attacked(them, kings[us]) &&
          !attacked(them, castling_from + 1) &&
          !attacked(them, castling_to)
        ) {
          add_move(board, moves, kings[us], castling_to, BITS.KSIDE_CASTLE)
        }
      }

      /* queen-side castling */
      if (castling[us] & BITS.QSIDE_CASTLE) {
        var castling_from = kings[us]
        var castling_to = castling_from - 2

        if (
          board[castling_from - 1] == null &&
          board[castling_from - 2] == null &&
          board[castling_from - 3] == null &&
          !attacked(them, kings[us]) &&
          !attacked(them, castling_from - 1) &&
          !attacked(them, castling_to)
        ) {
          add_move(board, moves, kings[us], castling_to, BITS.QSIDE_CASTLE)
        }
      }
    }

    /* return all pseudo-legal moves (this includes moves that allow the king
     * to be captured)
     */
    if (!legal) {
      return moves
    }

    /* filter out illegal moves */
    var legal_moves = []
    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])
      if (!king_attacked(us)) {
        legal_moves.push(moves[i])
      }
      undo_move()
    }

    return legal_moves
  }

  /* convert a move from 0x88 coordinates to Standard Algebraic Notation
   * (SAN)
   *
   * @param {boolean} sloppy Use the sloppy SAN generator to work around over
   * disambiguation bugs in Fritz and Chessbase.  See below:
   *
   * r1bqkbnr/ppp2ppp/2n5/1B1pP3/4P3/8/PPPP2PP/RNBQK1NR b KQkq - 2 4
   * 4. ... Nge7 is overly disambiguated because the knight on c6 is pinned
   * 4. ... Ne7 is technically the valid SAN
   */
  function move_to_san(move, sloppy) {
    var output = ''

    if (move.flags & BITS.KSIDE_CASTLE) {
      output = 'O-O'
    } else if (move.flags & BITS.QSIDE_CASTLE) {
      output = 'O-O-O'
    } else {
      var disambiguator = get_disambiguator(move, sloppy)

      if (move.piece !== PAWN) {
        output += move.piece.toUpperCase() + disambiguator
      }

      if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
        if (move.piece === PAWN) {
          output += algebraic(move.from)[0]
        }
        output += 'x'
      }

      output += algebraic(move.to)

      if (move.flags & BITS.PROMOTION) {
        output += '=' + move.promotion.toUpperCase()
      }
    }

    make_move(move)
    if (in_check()) {
      if (in_checkmate()) {
        output += '#'
      } else {
        output += '+'
      }
    }
    undo_move()

    return output
  }

  // parses all of the decorators out of a SAN string
  function stripped_san(move) {
    return move.replace(/=/, '').replace(/[+#]?[?!]*$/, '')
  }

  function attacked(color, square) {
    for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      /* if empty square or wrong color */
      if (board[i] == null || board[i].color !== color) continue

      var piece = board[i]
      var difference = i - square
      var index = difference + 119

      if (ATTACKS[index] & (1 << SHIFTS[piece.type])) {
        if (piece.type === PAWN) {
          if (difference > 0) {
            if (piece.color === WHITE) return true
          } else {
            if (piece.color === BLACK) return true
          }
          continue
        }

        /* if the piece is a knight or a king */
        if (piece.type === 'n' || piece.type === 'k') return true

        var offset = RAYS[index]
        var j = i + offset

        var blocked = false
        while (j !== square) {
          if (board[j] != null) {
            blocked = true
            break
          }
          j += offset
        }

        if (!blocked) return true
      }
    }

    return false
  }

  function king_attacked(color) {
    return attacked(swap_color(color), kings[color])
  }

  function in_check() {
    return king_attacked(turn)
  }

  function in_checkmate() {
    return in_check() && generate_moves().length === 0
  }

  function in_stalemate() {
    return !in_check() && generate_moves().length === 0
  }

  function insufficient_material() {
    var pieces = {}
    var bishops = []
    var num_pieces = 0
    var sq_color = 0

    for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
      sq_color = (sq_color + 1) % 2
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece) {
        pieces[piece.type] = piece.type in pieces ? pieces[piece.type] + 1 : 1
        if (piece.type === BISHOP) {
          bishops.push(sq_color)
        }
        num_pieces++
      }
    }

    /* k vs. k */
    if (num_pieces === 2) {
      return true
    } else if (
      /* k vs. kn .... or .... k vs. kb */
      num_pieces === 3 &&
      (pieces[BISHOP] === 1 || pieces[KNIGHT] === 1)
    ) {
      return true
    } else if (num_pieces === pieces[BISHOP] + 2) {
      /* kb vs. kb where any number of bishops are all on the same color */
      var sum = 0
      var len = bishops.length
      for (var i = 0; i < len; i++) {
        sum += bishops[i]
      }
      if (sum === 0 || sum === len) {
        return true
      }
    }

    return false
  }

  function in_threefold_repetition() {
    /* TODO: while this function is fine for casual use, a better
     * implementation would use a Zobrist key (instead of FEN). the
     * Zobrist key would be maintained in the make_move/undo_move functions,
     * avoiding the costly that we do below.
     */
    var moves = []
    var positions = {}
    var repetition = false

    while (true) {
      var move = undo_move()
      if (!move) break
      moves.push(move)
    }

    while (true) {
      /* remove the last two fields in the FEN string, they're not needed
       * when checking for draw by rep */
      var fen = generate_fen()
        .split(' ')
        .slice(0, 4)
        .join(' ')

      /* has the position occurred three or move times */
      positions[fen] = fen in positions ? positions[fen] + 1 : 1
      if (positions[fen] >= 3) {
        repetition = true
      }

      if (!moves.length) {
        break
      }
      make_move(moves.pop())
    }

    return repetition
  }

  function push(move) {
    history.push({
      move: move,
      kings: { b: kings.b, w: kings.w },
      turn: turn,
      castling: { b: castling.b, w: castling.w },
      ep_square: ep_square,
      half_moves: half_moves,
      move_number: move_number
    })
  }

  function make_move(move) {
    var us = turn
    var them = swap_color(us)
    push(move)

    board[move.to] = board[move.from]
    board[move.from] = null

    /* if ep capture, remove the captured pawn */
    if (move.flags & BITS.EP_CAPTURE) {
      if (turn === BLACK) {
        board[move.to - 16] = null
      } else {
        board[move.to + 16] = null
      }
    }

    /* if pawn promotion, replace with new piece */
    if (move.flags & BITS.PROMOTION) {
      board[move.to] = { type: move.promotion, color: us }
    }

    /* if we moved the king */
    if (board[move.to].type === KING) {
      kings[board[move.to].color] = move.to

      /* if we castled, move the rook next to the king */
      if (move.flags & BITS.KSIDE_CASTLE) {
        var castling_to = move.to - 1
        var castling_from = move.to + 1
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        var castling_to = move.to + 1
        var castling_from = move.to - 2
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      }

      /* turn off castling */
      castling[us] = ''
    }

    /* turn off castling if we move a rook */
    if (castling[us]) {
      for (var i = 0, len = ROOKS[us].length; i < len; i++) {
        if (
          move.from === ROOKS[us][i].square &&
          castling[us] & ROOKS[us][i].flag
        ) {
          castling[us] ^= ROOKS[us][i].flag
          break
        }
      }
    }

    /* turn off castling if we capture a rook */
    if (castling[them]) {
      for (var i = 0, len = ROOKS[them].length; i < len; i++) {
        if (
          move.to === ROOKS[them][i].square &&
          castling[them] & ROOKS[them][i].flag
        ) {
          castling[them] ^= ROOKS[them][i].flag
          break
        }
      }
    }

    /* if big pawn move, update the en passant square */
    if (move.flags & BITS.BIG_PAWN) {
      if (turn === 'b') {
        ep_square = move.to - 16
      } else {
        ep_square = move.to + 16
      }
    } else {
      ep_square = EMPTY
    }

    /* reset the 50 move counter if a pawn is moved or a piece is captured */
    if (move.piece === PAWN) {
      half_moves = 0
    } else if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
      half_moves = 0
    } else {
      half_moves++
    }

    if (turn === BLACK) {
      move_number++
    }
    turn = swap_color(turn)
  }

  function undo_move() {
    var old = history.pop()
    if (old == null) {
      return null
    }

    var move = old.move
    kings = old.kings
    turn = old.turn
    castling = old.castling
    ep_square = old.ep_square
    half_moves = old.half_moves
    move_number = old.move_number

    var us = turn
    var them = swap_color(turn)

    board[move.from] = board[move.to]
    board[move.from].type = move.piece // to undo any promotions
    board[move.to] = null

    if (move.flags & BITS.CAPTURE) {
      board[move.to] = { type: move.captured, color: them }
    } else if (move.flags & BITS.EP_CAPTURE) {
      var index
      if (us === BLACK) {
        index = move.to - 16
      } else {
        index = move.to + 16
      }
      board[index] = { type: PAWN, color: them }
    }

    if (move.flags & (BITS.KSIDE_CASTLE | BITS.QSIDE_CASTLE)) {
      var castling_to, castling_from
      if (move.flags & BITS.KSIDE_CASTLE) {
        castling_to = move.to + 1
        castling_from = move.to - 1
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        castling_to = move.to - 2
        castling_from = move.to + 1
      }

      board[castling_to] = board[castling_from]
      board[castling_from] = null
    }

    return move
  }

  /* this function is used to uniquely identify ambiguous moves */
  function get_disambiguator(move, sloppy) {
    var moves = generate_moves({ legal: !sloppy })

    var from = move.from
    var to = move.to
    var piece = move.piece

    var ambiguities = 0
    var same_rank = 0
    var same_file = 0

    for (var i = 0, len = moves.length; i < len; i++) {
      var ambig_from = moves[i].from
      var ambig_to = moves[i].to
      var ambig_piece = moves[i].piece

      /* if a move of the same piece type ends on the same to square, we'll
       * need to add a disambiguator to the algebraic notation
       */
      if (piece === ambig_piece && from !== ambig_from && to === ambig_to) {
        ambiguities++

        if (rank(from) === rank(ambig_from)) {
          same_rank++
        }

        if (file(from) === file(ambig_from)) {
          same_file++
        }
      }
    }

    if (ambiguities > 0) {
      /* if there exists a similar moving piece on the same rank and file as
       * the move in question, use the square as the disambiguator
       */
      if (same_rank > 0 && same_file > 0) {
        return algebraic(from)
      } else if (same_file > 0) {
        /* if the moving piece rests on the same file, use the rank symbol as the
         * disambiguator
         */
        return algebraic(from).charAt(1)
      } else {
        /* else use the file symbol */
        return algebraic(from).charAt(0)
      }
    }

    return ''
  }

  function ascii() {
    var s = '   +------------------------+\n'
    for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
      /* display the rank */
      if (file(i) === 0) {
        s += ' ' + '87654321'[rank(i)] + ' |'
      }

      /* empty piece */
      if (board[i] == null) {
        s += ' . '
      } else {
        var piece = board[i].type
        var color = board[i].color
        var symbol = color === WHITE ? piece.toUpperCase() : piece.toLowerCase()
        s += ' ' + symbol + ' '
      }

      if ((i + 1) & 0x88) {
        s += '|\n'
        i += 8
      }
    }
    s += '   +------------------------+\n'
    s += '     a  b  c  d  e  f  g  h\n'

    return s
  }

  // convert a move from Standard Algebraic Notation (SAN) to 0x88 coordinates
  function move_from_san(move, sloppy) {
    // strip off any move decorations: e.g Nf3+?!
    var clean_move = stripped_san(move)

    // if we're using the sloppy parser run a regex to grab piece, to, and from
    // this should parse invalid SAN like: Pe2-e4, Rc1c4, Qf3xf7
    if (sloppy) {
      var matches = clean_move.match(
        /([pnbrqkPNBRQK])?([a-h][1-8])x?-?([a-h][1-8])([qrbnQRBN])?/
      )
      if (matches) {
        var piece = matches[1]
        var from = matches[2]
        var to = matches[3]
        var promotion = matches[4]
      }
    }

    var moves = generate_moves()
    for (var i = 0, len = moves.length; i < len; i++) {
      // try the strict parser first, then the sloppy parser if requested
      // by the user
      if (
        clean_move === stripped_san(move_to_san(moves[i])) ||
        (sloppy && clean_move === stripped_san(move_to_san(moves[i], true)))
      ) {
        return moves[i]
      } else {
        if (
          matches &&
          (!piece || piece.toLowerCase() == moves[i].piece) &&
          SQUARES[from] == moves[i].from &&
          SQUARES[to] == moves[i].to &&
          (!promotion || promotion.toLowerCase() == moves[i].promotion)
        ) {
          return moves[i]
        }
      }
    }

    return null
  }

  /*****************************************************************************
   * UTILITY FUNCTIONS
   ****************************************************************************/
  function rank(i) {
    return i >> 4
  }

  function file(i) {
    return i & 15
  }

  function algebraic(i) {
    var f = file(i),
      r = rank(i)
    return 'abcdefgh'.substring(f, f + 1) + '87654321'.substring(r, r + 1)
  }

  function swap_color(c) {
    return c === WHITE ? BLACK : WHITE
  }

  function is_digit(c) {
    return '0123456789'.indexOf(c) !== -1
  }

  /* pretty = external move object */
  function make_pretty(ugly_move) {
    var move = clone(ugly_move)
    move.san = move_to_san(move, false)
    move.to = algebraic(move.to)
    move.from = algebraic(move.from)

    var flags = ''

    for (var flag in BITS) {
      if (BITS[flag] & move.flags) {
        flags += FLAGS[flag]
      }
    }
    move.flags = flags

    return move
  }

  function clone(obj) {
    var dupe = obj instanceof Array ? [] : {}

    for (var property in obj) {
      if (typeof property === 'object') {
        dupe[property] = clone(obj[property])
      } else {
        dupe[property] = obj[property]
      }
    }

    return dupe
  }

  function trim(str) {
    return str.replace(/^\s+|\s+$/g, '')
  }

  /*****************************************************************************
   * DEBUGGING UTILITIES
   ****************************************************************************/
  function perft(depth) {
    var moves = generate_moves({ legal: false })
    var nodes = 0
    var color = turn

    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])
      if (!king_attacked(color)) {
        if (depth - 1 > 0) {
          var child_nodes = perft(depth - 1)
          nodes += child_nodes
        } else {
          nodes++
        }
      }
      undo_move()
    }

    return nodes
  }

  return {
    /***************************************************************************
     * PUBLIC CONSTANTS (is there a better way to do this?)
     **************************************************************************/
    WHITE: WHITE,
    BLACK: BLACK,
    PAWN: PAWN,
    KNIGHT: KNIGHT,
    BISHOP: BISHOP,
    ROOK: ROOK,
    QUEEN: QUEEN,
    KING: KING,
    SQUARES: (function() {
      /* from the ECMA-262 spec (section 12.6.4):
       * "The mechanics of enumerating the properties ... is
       * implementation dependent"
       * so: for (var sq in SQUARES) { keys.push(sq); } might not be
       * ordered correctly
       */
      var keys = []
      for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
        if (i & 0x88) {
          i += 7
          continue
        }
        keys.push(algebraic(i))
      }
      return keys
    })(),
    FLAGS: FLAGS,

    /***************************************************************************
     * PUBLIC API
     **************************************************************************/
    load: function(fen) {
      return load(fen)
    },

    reset: function() {
      return reset()
    },

    moves: function(options) {
      /* The internal representation of a chess move is in 0x88 format, and
       * not meant to be human-readable.  The code below converts the 0x88
       * square coordinates to algebraic coordinates.  It also prunes an
       * unnecessary move keys resulting from a verbose call.
       */

      var ugly_moves = generate_moves(options)
      var moves = []

      for (var i = 0, len = ugly_moves.length; i < len; i++) {
        /* does the user want a full move object (most likely not), or just
         * SAN
         */
        if (
          typeof options !== 'undefined' &&
          'verbose' in options &&
          options.verbose
        ) {
          moves.push(make_pretty(ugly_moves[i]))
        } else {
          moves.push(move_to_san(ugly_moves[i], false))
        }
      }

      return moves
    },

    in_check: function() {
      return in_check()
    },

    in_checkmate: function() {
      return in_checkmate()
    },

    in_stalemate: function() {
      return in_stalemate()
    },

    in_draw: function() {
      return (
        half_moves >= 100 ||
        in_stalemate() ||
        insufficient_material() ||
        in_threefold_repetition()
      )
    },

    insufficient_material: function() {
      return insufficient_material()
    },

    in_threefold_repetition: function() {
      return in_threefold_repetition()
    },

    game_over: function() {
      return (
        half_moves >= 100 ||
        in_checkmate() ||
        in_stalemate() ||
        insufficient_material() ||
        in_threefold_repetition()
      )
    },

    validate_fen: function(fen) {
      return validate_fen(fen)
    },

    fen: function() {
      return generate_fen()
    },

    board: function() {
      var output = [],
        row = []

      for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
        if (board[i] == null) {
          row.push(null)
        } else {
          row.push({ type: board[i].type, color: board[i].color })
        }
        if ((i + 1) & 0x88) {
          output.push(row)
          row = []
          i += 8
        }
      }

      return output
    },

    pgn: function(options) {
      /* using the specification from http://www.chessclub.com/help/PGN-spec
       * example for html usage: .pgn({ max_width: 72, newline_char: "<br />" })
       */
      var newline =
        typeof options === 'object' && typeof options.newline_char === 'string'
          ? options.newline_char
          : '\n'
      var max_width =
        typeof options === 'object' && typeof options.max_width === 'number'
          ? options.max_width
          : 0
      var result = []
      var header_exists = false

      /* add the PGN header headerrmation */
      for (var i in header) {
        /* TODO: order of enumerated properties in header object is not
         * guaranteed, see ECMA-262 spec (section 12.6.4)
         */
        result.push('[' + i + ' "' + header[i] + '"]' + newline)
        header_exists = true
      }

      if (header_exists && history.length) {
        result.push(newline)
      }

      /* pop all of history onto reversed_history */
      var reversed_history = []
      while (history.length > 0) {
        reversed_history.push(undo_move())
      }

      var moves = []
      var move_string = ''

      /* build the list of moves.  a move_string looks like: "3. e3 e6" */
      while (reversed_history.length > 0) {
        var move = reversed_history.pop()

        /* if the position started with black to move, start PGN with 1. ... */
        if (!history.length && move.color === 'b') {
          move_string = move_number + '. ...'
        } else if (move.color === 'w') {
          /* store the previous generated move_string if we have one */
          if (move_string.length) {
            moves.push(move_string)
          }
          move_string = move_number + '.'
        }

        move_string = move_string + ' ' + move_to_san(move, false)
        make_move(move)
      }

      /* are there any other leftover moves? */
      if (move_string.length) {
        moves.push(move_string)
      }

      /* is there a result? */
      if (typeof header.Result !== 'undefined') {
        moves.push(header.Result)
      }

      /* history should be back to what is was before we started generating PGN,
       * so join together moves
       */
      if (max_width === 0) {
        return result.join('') + moves.join(' ')
      }

      /* wrap the PGN output at max_width */
      var current_width = 0
      for (var i = 0; i < moves.length; i++) {
        /* if the current move will push past max_width */
        if (current_width + moves[i].length > max_width && i !== 0) {
          /* don't end the line with whitespace */
          if (result[result.length - 1] === ' ') {
            result.pop()
          }

          result.push(newline)
          current_width = 0
        } else if (i !== 0) {
          result.push(' ')
          current_width++
        }
        result.push(moves[i])
        current_width += moves[i].length
      }

      return result.join('')
    },

    load_pgn: function(pgn, options) {
      // allow the user to specify the sloppy move parser to work around over
      // disambiguation bugs in Fritz and Chessbase
      var sloppy =
        typeof options !== 'undefined' && 'sloppy' in options
          ? options.sloppy
          : false

      function mask(str) {
        return str.replace(/\\/g, '\\')
      }

      function has_keys(object) {
        for (var key in object) {
          return true
        }
        return false
      }

      function parse_pgn_header(header, options) {
        var newline_char =
          typeof options === 'object' &&
          typeof options.newline_char === 'string'
            ? options.newline_char
            : '\r?\n'
        var header_obj = {}
        var headers = header.split(new RegExp(mask(newline_char)))
        var key = ''
        var value = ''

        for (var i = 0; i < headers.length; i++) {
          key = headers[i].replace(/^\[([A-Z][A-Za-z]*)\s.*\]$/, '$1')
          value = headers[i].replace(/^\[[A-Za-z]+\s"(.*)"\]$/, '$1')
          if (trim(key).length > 0) {
            header_obj[key] = value
          }
        }

        return header_obj
      }

      var newline_char =
        typeof options === 'object' && typeof options.newline_char === 'string'
          ? options.newline_char
          : '\r?\n'

      // RegExp to split header. Takes advantage of the fact that header and movetext
      // will always have a blank line between them (ie, two newline_char's).
      // With default newline_char, will equal: /^(\[((?:\r?\n)|.)*\])(?:\r?\n){2}/
      var header_regex = new RegExp(
        '^(\\[((?:' +
          mask(newline_char) +
          ')|.)*\\])' +
          '(?:' +
          mask(newline_char) +
          '){2}'
      )

      // If no header given, begin with moves.
      var header_string = header_regex.test(pgn)
        ? header_regex.exec(pgn)[1]
        : ''

      // Put the board in the starting position
      reset()

      /* parse PGN header */
      var headers = parse_pgn_header(header_string, options)
      for (var key in headers) {
        set_header([key, headers[key]])
      }

      /* load the starting position indicated by [Setup '1'] and
       * [FEN position] */
      if (headers['SetUp'] === '1') {
        if (!('FEN' in headers && load(headers['FEN'], true))) {
          // second argument to load: don't clear the headers
          return false
        }
      }

      /* delete header to get the moves */
      var ms = pgn
        .replace(header_string, '')
        .replace(new RegExp(mask(newline_char), 'g'), ' ')

      /* delete comments */
      ms = ms.replace(/(\{[^}]+\})+?/g, '')

      /* delete recursive annotation variations */
      var rav_regex = /(\([^\(\)]+\))+?/g
      while (rav_regex.test(ms)) {
        ms = ms.replace(rav_regex, '')
      }

      /* delete move numbers */
      ms = ms.replace(/\d+\.(\.\.)?/g, '')

      /* delete ... indicating black to move */
      ms = ms.replace(/\.\.\./g, '')

      /* delete numeric annotation glyphs */
      ms = ms.replace(/\$\d+/g, '')

      /* trim and get array of moves */
      var moves = trim(ms).split(new RegExp(/\s+/))

      /* delete empty entries */
      moves = moves
        .join(',')
        .replace(/,,+/g, ',')
        .split(',')
      var move = ''

      for (var half_move = 0; half_move < moves.length - 1; half_move++) {
        move = move_from_san(moves[half_move], sloppy)

        /* move not possible! (don't clear the board to examine to show the
         * latest valid position)
         */
        if (move == null) {
          return false
        } else {
          make_move(move)
        }
      }

      /* examine last move */
      move = moves[moves.length - 1]
      if (POSSIBLE_RESULTS.indexOf(move) > -1) {
        if (has_keys(header) && typeof header.Result === 'undefined') {
          set_header(['Result', move])
        }
      } else {
        move = move_from_san(move, sloppy)
        if (move == null) {
          return false
        } else {
          make_move(move)
        }
      }
      return true
    },

    header: function() {
      return set_header(arguments)
    },

    ascii: function() {
      return ascii()
    },

    turn: function() {
      return turn
    },

    move: function(move, options) {
      /* The move function can be called with in the following parameters:
       *
       * .move('Nxb7')      <- where 'move' is a case-sensitive SAN string
       *
       * .move({ from: 'h7', <- where the 'move' is a move object (additional
       *         to :'h8',      fields are ignored)
       *         promotion: 'q',
       *      })
       */

      // allow the user to specify the sloppy move parser to work around over
      // disambiguation bugs in Fritz and Chessbase
      var sloppy =
        typeof options !== 'undefined' && 'sloppy' in options
          ? options.sloppy
          : false

      var move_obj = null

      if (typeof move === 'string') {
        move_obj = move_from_san(move, sloppy)
      } else if (typeof move === 'object') {
        var moves = generate_moves()

        /* convert the pretty move object to an ugly move object */
        for (var i = 0, len = moves.length; i < len; i++) {
          if (
            move.from === algebraic(moves[i].from) &&
            move.to === algebraic(moves[i].to) &&
            (!('promotion' in moves[i]) ||
              move.promotion === moves[i].promotion)
          ) {
            move_obj = moves[i]
            break
          }
        }
      }

      /* failed to find move */
      if (!move_obj) {
        return null
      }

      /* need to make a copy of move because we can't generate SAN after the
       * move is made
       */
      var pretty_move = make_pretty(move_obj)

      make_move(move_obj)

      return pretty_move
    },

    undo: function() {
      var move = undo_move()
      return move ? make_pretty(move) : null
    },

    clear: function() {
      return clear()
    },

    put: function(piece, square) {
      return put(piece, square)
    },

    get: function(square) {
      return get(square)
    },

    remove: function(square) {
      return remove(square)
    },

    perft: function(depth) {
      return perft(depth)
    },

    square_color: function(square) {
      if (square in SQUARES) {
        var sq_0x88 = SQUARES[square]
        return (rank(sq_0x88) + file(sq_0x88)) % 2 === 0 ? 'light' : 'dark'
      }

      return null
    },

    history: function(options) {
      var reversed_history = []
      var move_history = []
      var verbose =
        typeof options !== 'undefined' &&
        'verbose' in options &&
        options.verbose

      while (history.length > 0) {
        reversed_history.push(undo_move())
      }

      while (reversed_history.length > 0) {
        var move = reversed_history.pop()
        if (verbose) {
          move_history.push(make_pretty(move))
        } else {
          move_history.push(move_to_san(move))
        }
        make_move(move)
      }

      return move_history
    }
  }
}

if (typeof exports !== 'undefined') exports.Chess = Chess
/* export Chess object for any RequireJS compatible environment */
if (typeof define !== 'undefined')
  define(function() {
    return Chess
  })

<script>
(function () {
  "use strict";

  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  if (!window.Chess || !C) { $("content").innerHTML = '<p class="feedback err">Le moteur d\'échecs ou le contenu du cours n\'a pas pu se charger. Rechargez la page.</p>'; return; }

  /* ---------- Notation française ---------- */
  var EN2FR = { K: "R", Q: "D", R: "T", B: "F", N: "C" }, FR2EN = { R: "K", D: "Q", T: "R", F: "B", C: "N" };

  function fr2en(s) { s = s.replace(/0/g, "O"); if (FR2EN[s[0]]) s = FR2EN[s[0]] + s.slice(1); return s.replace(/=([DTFC])/, function (_, p) { return "=" + FR2EN[p]; }); }
  function bare(s) { return s.replace(/[+#!?]/g, ""); }
  function tokens(line) { return line.split(/\s+/).map(function (t) { return t.replace(/^\d+\.(\.\.)?/, ""); }).filter(Boolean); }
  var START = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";

  /* ---------- Carnet de l'élève (navigateur) ---------- */

  try { var raw = localStorage.getItem(KEY); if (raw) prog = JSON.parse(raw) || prog; } catch (e) {}
  prog.done = prog.done || {}; prog.err = prog.err || {};
  function saveProg() { try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) {} }
  function mark(id, v, errors) {
    if (errors) prog.err[id] = (prog.err[id] || 0) + errors;
    if (prog.done[id] !== "ok") prog.done[id] = v;
    saveProg(); renderNav(); refreshChips();
  }

  }); });

  var partieByLesson = {}; C.parties.forEach(function (p) { partieByLesson[p.lecon] = p; });
  function lessonDone(l) { return l.exercices.every(function (e) { return prog.done[e.id] === "ok"; }); }
  function count(list) { var d = 0; list.forEach(function (e) { if (prog.done[e.id] === "ok") d++; }); return [d, list.length]; }
  function levelEx(n) { var a = []; n.lecons.forEach(function (l) { a = a.concat(l.exercices); }); return a; }

  /* ---------- Navigation ---------- */

    h += lk("accueil", "Accueil", CASES.accueil) + lk("repertoire", "Répertoire", CASES.repertoire);

      var c = count(levelEx(n));

      lk("carnet", "Mon carnet", CASES.carnet) + "</div>";

    $("navSelect").innerHTML = s; $("navSelect").value = route;
  }

  /* ---------- Éléments de liste ---------- */
  var registry = {};

    registry[key] = function () { loadLine(li.nom, li.coups, li.camp || side || "w", li.note, li.comments); };

  function setHead(title, kind, consigne) {
    $("pTitle").textContent = title; $("pKind").textContent = kind || ""; $("panel").classList.toggle("has-consigne", !!consigne);
    $("pConsigne").hidden = !consigne; $("pConsigne").textContent = consigne || "";
    $("pComment").hidden = true;
  }
  function feedback(html, cls) { var f = $("feedback"); f.className = "feedback" + (cls ? " " + cls : ""); f.innerHTML = html; }
  function moveListHTML(startFen, sans, cur, freeFrom) {
    var parts = startFen.split(" "), num = +parts[5], white = parts[1] === "w", h = "";
    sans.forEach(function (s, i) {
      if (white) h += '<span class="n">' + num + ".</span>"; else if (i === 0) h += '<span class="n">' + num + "...</span>";
      h += '<button data-i="' + i + '" class="' + (i === cur ? "cur" : "") + (freeFrom != null && i >= freeFrom ? " free" : "") + '">' + esc(s) + "</button>";
      if (!white) num++;
      white = !white;
    });
    return h;
  }
  var FS = '<button class="btn ic" data-a="fs" title="Mode séance : échiquier en plein écran" aria-label="Mode séance"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg><span class="lbl">Mode séance</span></button>';
  var FLIP = '<button class="btn ic" data-a="flip" title="Retourner l\'échiquier" aria-label="Retourner l\'échiquier"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 20V5M4 9l4-4 4 4M16 4v15M12 15l4 4 4-4"/></svg><span class="lbl">Retourner</span></button>';

  /* Mode ligne */
  var L = null, S = null;
  function loadLine(nom, line, side, note, comments) {
    stopTimers(); S = null;
    var sans = line ? tokens(line) : [], g = new Chess(), fens = [g.fen()], moves = [null];
    sans.forEach(function (t) { var m = g.move(fr2en(t)); fens.push(g.fen()); moves.push(m ? { from: m.from, to: m.to } : null); });
    L = { nom: nom, line: line, side: side, note: note, comments: comments || null, sans: sans.slice(), fens: fens, moves: moves, idx: 0, base: sans.length };
    orient = side; sel = null; hintSq = null; hintTo = null;
    setHead(nom, line ? (comments ? "Partie commentée" : "Ligne à rejouer") : "", "");
    showLineIdx(0);
    feedback((note ? esc(note) + " " : "") + (line ? "▶ ou → pour avancer ; vous pouvez aussi jouer vos coups." : ""), "");
    interactive = true;
    onUserMove = function (m) {
      var fr = en2fr(m.san);
      if (L.idx < L.base && bare(L.sans[L.idx]) === bare(fr)) { L.idx++; showLineIdx(L.idx); return; }
      L.sans = L.sans.slice(0, L.idx).concat([fr]);
      L.fens = L.fens.slice(0, L.idx + 1).concat([game.fen()]);
      L.moves = L.moves.slice(0, L.idx + 1).concat([{ from: m.from, to: m.to }]);
      if (L.idx < L.base) L.base = L.idx;
      L.idx++; showLineIdx(L.idx);
      feedback("Variante libre : vous êtes sorti de la ligne. " + (game.in_checkmate() ? "<b>Échec et mat.</b> " : "") + "« Revenir à la ligne » pour reprendre.", "");
    };
  }
  function showLineIdx(i) {
    L.idx = Math.max(0, Math.min(i, L.fens.length - 1));
    game.load(L.fens[L.idx]); lastMove = L.moves[L.idx]; sel = null;
    renderBoard();
    $("movelist").innerHTML = moveListHTML(START, L.sans, L.idx - 1, L.base < L.sans.length ? L.base : null);
    if (L.comments && L.idx <= L.base) {
      var best = null; Object.keys(L.comments).forEach(function (k) { if (+k <= L.idx - 1 && (best === null || +k > +best)) best = k; });
      $("pComment").hidden = best === null; if (best !== null) $("pComment").textContent = L.comments[best];
    } else $("pComment").hidden = true;
    renderLineControls();
    var cur = $("movelist").querySelector(".cur"); if (cur) cur.scrollIntoView({ block: "nearest" });
  }
  function renderLineControls() {
    var n = L.fens.length - 1, h = "";
    h += '<button class="btn icon" data-a="first" aria-label="Début"' + (L.idx === 0 ? " disabled" : "") + ">⏮</button>";
    h += '<button class="btn icon" data-a="prev" aria-label="Coup précédent"' + (L.idx === 0 ? " disabled" : "") + ">◀</button>";
    h += '<button class="btn icon" data-a="next" aria-label="Coup suivant"' + (L.idx >= n ? " disabled" : "") + ">▶</button>";
    h += '<button class="btn icon" data-a="last" aria-label="Fin"' + (L.idx >= n ? " disabled" : "") + ">⏭</button>";
    if (L.line && L.base < L.sans.length) h += '<button class="btn" data-a="back">Revenir à la ligne</button>';
    if (L.line && tokens(L.line).length > 1) h += '<button class="btn primary" data-a="train">M\'entraîner</button>';
    h += FLIP + FS;
    $("controls").innerHTML = h;
  }

  /* Mode séquence : exercice ou entraînement */
  function buildSteps(sol) { return sol.map(function (p, i) { return i % 2 === 0 ? { who: "user", accept: p } : { who: "opp", san: p }; }); }
  function loadExercise(ex) {
    stopTimers(); L = null;
    var fen = ex.fen || fenFromLine(ex.ligne), tmp = new Chess(fen);
    orient = tmp.turn(); sel = null; hintSq = null; hintTo = null; lastMove = null;
    setHead((/^S/.test(ex.id) ? "Problème " : "Exercice ") + ex.id + (ex.etoiles ? " " + "★".repeat(ex.etoiles) : ""), ex.type === "question" ? "Question de plan" : (tmp.turn() === "w" ? "Les Blancs jouent" : "Les Noirs jouent"), ex.consigne);
    if (ex.type === "question") {
      S = { ex: ex, fen: fen, steps: [], played: [], i: 0, done: false, question: true };
      game.load(fen); renderBoard(); interactive = false; onUserMove = null;
      $("movelist").innerHTML = "";
      feedback("Réfléchissez au plan, puis affichez la réponse.", "");
      renderSeqControls(); return;
    }
    S = { ex: ex, fen: fen, steps: buildSteps(ex.sol), played: [], moves: [], i: 0, done: false, mat: ex.mat, retours: ex.retours || {}, errors: 0 };
    startSeq();
  }
  function loadTraining() {
    stopTimers();
    var sans = tokens(L.line), side = L.side, steps = sans.map(function (s, i) { return (i % 2 === 0 ? "w" : "b") === side ? { who: "user", accept: [s] } : { who: "opp", san: s }; });
    S = { ex: { id: "train", solTexte: "Ligne complète : " + L.line, line: L.line, nom: L.nom, note: L.note, comments: L.comments }, fen: START, steps: steps, played: [], moves: [], i: 0, done: false, training: true, side: side, errors: 0, retours: {} };
    orient = side; var nom = L.nom; L = null;
    setHead(nom, "Entraînement · " + (side === "w" ? "les Blancs" : "les Noirs"), "Jouez de mémoire les coups de la ligne. L'échiquier joue l'autre camp.");
    startSeq();
  }
  function startSeq() {
    stopTimers();
    game.load(S.fen); lastMove = null; sel = null; hintSq = null; hintTo = null; hintStep = 0; S.played = []; S.moves = []; S.i = 0; S.done = false;
    renderBoard(); renderSeqMoves(); renderSeqControls();
    interactive = true; onUserMove = seqUserMove;
    feedback(S.training ? "À vous de jouer." : "Jouez votre coup sur l'échiquier.", "");
    autoOpp();
  }
  function renderSeqMoves() { $("movelist").innerHTML = moveListHTML(S.fen, S.played, S.played.length - 1, null); }
  function autoOpp() {
    if (S.i < S.steps.length && S.steps[S.i].who === "opp") {
      interactive = false;
      later(function () {
        var m = game.move(fr2en(S.steps[S.i].san));
        if (m) { S.played.push(en2fr(m.san)); lastMove = { from: m.from, to: m.to }; }
        S.i++; renderBoard(); renderSeqMoves();
        if (S.i >= S.steps.length) return finishSeq();
        interactive = true;
      }, 550);
    } else if (S.i >= S.steps.length) finishSeq();
  }
  function seqUserMove(m) {
    var fr = en2fr(m.san), st = S.steps[S.i];
    if (!st || st.who !== "user") { game.undo(); renderBoard(); return; }
    var k = -1; st.accept.forEach(function (a, j) { if (k < 0 && bare(a) === bare(fr)) k = j; });
    var mate = S.mat && game.in_checkmate();
    if (k === 0 || (mate && k < 0 && S.i === S.steps.length - 1)) {
      S.played.push(fr); S.moves.push(m); S.i++; renderSeqMoves();
      if (S.i >= S.steps.length) return finishSeq();
      feedback("<b>Bien joué : " + esc(fr) + ".</b> " + (S.training ? "" : "Continuez…"), "ok");
      autoOpp(); return;
    }
    if (k > 0 || mate) { S.played.push(fr); renderSeqMoves(); finishSeq("Bon coup aussi ! La solution du cours joue " + esc(st.accept[0]) + "."); return; }
    S.errors++; interactive = false;
    var msg = S.retours[fr] || S.retours[bare(fr)] || (S.training ? "Ce n'est pas le coup de la ligne." : "Ce n'est pas le meilleur coup.") + " Réessayez.";
    feedback("<b>" + esc(fr) + "</b> : " + esc(msg), "err");
    var back = prevLast;
    later(function () { game.undo(); lastMove = back; renderBoard(); interactive = true; }, 900);
  }
  function finishSeq(extra) {
    S.done = true; interactive = false; onUserMove = null; renderSeqControls();
    if (S.training) { feedback("<b>Ligne terminée" + (S.errors ? " avec " + S.errors + " erreur" + (S.errors > 1 ? "s" : "") : " sans faute") + ".</b>", S.errors ? "" : "ok"); return; }
    if (S.shown) { feedback('Solution :<span class="sol">' + esc(S.ex.solTexte) + "</span>", ""); return; }
    mark(S.ex.id, "ok", S.errors);
    feedback("<b>Réussi !</b> " + (extra || "") + '<span class="sol">' + esc(S.ex.solTexte) + "</span>", "ok");
  }
  function renderSeqControls() {
    var h = "";
    if (S.question) h += '<button class="btn primary" data-a="reveal">Voir la réponse</button>' + FLIP;
    else {
      if (!S.done) h += '<button class="btn" data-a="hint">Indice</button><button class="btn" data-a="solution">Voir la solution</button>';
      var nx = S.done && !S.training ? nextExKey() : null;
      if (nx) h += '<button class="btn primary" data-a="nextex">Exercice suivant →</button>';
      h += '<button class="btn' + (S.done && !nx ? " primary" : "") + '" data-a="restart">Recommencer</button>' + FLIP;
      if (S.training) h += '<button class="btn" data-a="backline">Revoir la ligne</button>';
    }
    $("controls").innerHTML = h + FS;
  }
  function nextExKey() {
    var keys = Array.prototype.map.call(document.querySelectorAll('#content [data-load^="ex-"]:not([hidden])'), function (el) { return el.getAttribute("data-load"); });
    var i = keys.indexOf("ex-" + S.ex.id);
    return i >= 0 && i + 1 < keys.length ? keys[i + 1] : null;
  }
  function playSolution() {
    S.shown = true; interactive = false; onUserMove = null;
    if (!S.training) mark(S.ex.id, "vu", S.errors);
    (function step() {
      if (S.i >= S.steps.length) return finishSeq();
      var st = S.steps[S.i], m = game.move(fr2en(st.who === "user" ? st.accept[0] : st.san));
      if (m) { S.played.push(en2fr(m.san)); lastMove = { from: m.from, to: m.to }; }
      S.i++; renderBoard(); renderSeqMoves();
      later(step, 750);
    })();
    renderSeqControls();
  }

  $("controls").addEventListener("click", function (e) {
    var b = e.target.closest("[data-a]"); if (!b) return;
    var a = b.getAttribute("data-a");
    if (a === "flip") { orient = orient === "w" ? "b" : "w"; renderBoard(); return; }
    if (a === "fs") {
      var pnl = $("panel");
      try { if (document.fullscreenElement) document.exitFullscreen(); else if (pnl.requestFullscreen) pnl.requestFullscreen().catch(function () { feedback("Le plein écran n'est pas disponible ici.", ""); }); else feedback("Le plein écran n'est pas disponible ici.", ""); } catch (err) {}
      return;
    }
    if (L) {
      if (a === "first") showLineIdx(0);
      else if (a === "prev") showLineIdx(L.idx - 1);
      else if (a === "next") showLineIdx(L.idx + 1);
      else if (a === "last") showLineIdx(L.fens.length - 1);
      else if (a === "back") { var k = L; loadLine(k.nom, k.line, k.side, k.note, k.comments); }
      else if (a === "train") loadTraining();
      return;
    }
    if (!S) return;
    if (a === "reveal") { feedback('Réponse :<span class="sol">' + esc(S.ex.solTexte) + "</span>", "ok"); mark(S.ex.id, "ok"); }
    else if (a === "restart") { S.shown = false; S.errors = 0; startSeq(); }
    else if (a === "hint") {
      var st = S.steps[S.i]; if (!st || st.who !== "user") return;
      var m = game.move(fr2en(st.accept[0])); if (!m) return; game.undo();
      hintStep = Math.min(hintStep + 1, 2); hintSq = m.from; hintTo = hintStep > 1 ? m.to : null; sel = null; renderBoard();
      feedback(hintStep > 1 ? "Indice : la pièce entourée va sur la case marquée." : "Indice : jouez la pièce entourée. Cliquez encore sur « Indice » pour voir la case d'arrivée.", "");
    }
    else if (a === "solution") { stopTimers(); playSolution(); }
    else if (a === "nextex") { var nk = nextExKey(); if (nk) { activate(nk); var el = document.querySelector('[data-load="' + nk + '"]'); if (el && !NARROW.matches) el.scrollIntoView({ block: "nearest", behavior: "smooth" }); } }
    else if (a === "backline") { var x = S.ex; loadLine(x.nom, x.line, orient, x.note, x.comments); }
  });
  $("typein").addEventListener("submit", function (e) {
    e.preventDefault();
    var inp = $("typeMove"), v = inp.value.trim().replace(/[!?]+$/, ""); if (!v) return;
    if (!interactive || !onUserMove) { feedback("Attendez que ce soit à vous de jouer.", ""); return; }
    var m = game.move(fr2en(v));
    if (!m) { feedback("<b>" + esc(v) + "</b> : coup illégal ou mal écrit ici. Notation française : R, D, T, F, C, puis la case (ex. Cf3, Fxc6, 0-0).", "err"); return; }
    game.undo(); inp.value = "";
    commitUser({ from: m.from, to: m.to, promotion: m.promotion });
  });
  $("movelist").addEventListener("click", function (e) { var b = e.target.closest("[data-i]"); if (b && L) showLineIdx(+b.getAttribute("data-i") + 1); });
  document.addEventListener("keydown", function (e) {
    if (!L || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === "ArrowRight") { e.preventDefault(); showLineIdx(L.idx + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); showLineIdx(L.idx - 1); }
  });

  onRoute();
})();
</script>

</body>
